name = editorconfig
owner = rhun-editor
title = EditorConfig
description = Applies your .editorconfig files: indentation, tab width and line endings per file.
icon = icon.png
color = #cf5050
version = 0.2.1
protocol = 1
run.linux-x86_64 = bin/editorconfig-linux-x86_64
run.macos-arm64 = bin/editorconfig-macos-arm64
run.windows-x64 = bin/editorconfig-windows-x64.exe
on = open:*

[commands]
show = Show EditorConfig Settings

[subscribe]
opened = *

# project: read the .editorconfig files in every workspace folder, and (protocol 1.1,
# workspace_watch) hear when they change
[needs]
documents = write
project = read
